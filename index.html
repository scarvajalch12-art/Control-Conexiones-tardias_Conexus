<style>
/* Layout: consola operativa — cabecera con filtros, pestañas fijas, paneles de tablas y bandas de estado */
:root{
  --bg:#f3f6f6; --surface:#ffffff; --surface-2:#e9efef; --line:#d4dddd; --fg:#13252a; --muted:#56696e;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f181a; --surface:#152225; --surface-2:#1b2b2e; --line:#2a3d41; --fg:#e3eced; --muted:#93a8ac;
  --accent:#4fb7bf; --accent-fg:#06282b; --accent-soft:#173b3f;
  --crit:#f07a6e; --crit-soft:#3d1f1c; --warn:#e9b04f; --warn-soft:#3a2d12; --ok:#6cc790; --ok-soft:#173225; --info:#8eaef0; --info-soft:#1c2a45;
  --p-cafe:#d89a5c; --p-alm:#a593ec; --p-bano:#5cc2d9; --p-clas:#7d8e94; --p-otra:#e5b54a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f181a; --surface:#152225; --surface-2:#1b2b2e; --line:#2a3d41; --fg:#e3eced; --muted:#93a8ac;
  --accent:#4fb7bf; --accent-fg:#06282b; --accent-soft:#173b3f;
  --crit:#f07a6e; --crit-soft:#3d1f1c; --warn:#e9b04f; --warn-soft:#3a2d12; --ok:#6cc790; --ok-soft:#173225; --info:#8eaef0; --info-soft:#1c2a45;
  --p-cafe:#d89a5c; --p-alm:#a593ec; --p-bano:#5cc2d9; --p-clas:#7d8e94; --p-otra:#e5b54a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45}

.kpi.crit{border-top-color:var(--crit)} .kpi.warn{border-top-color:var(--warn)} .kpi.ok{border-top-color:var(--ok)} .kpi.acc{border-top-color:var(--accent)}
.kpi .v{font-family:var(--font-data);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}

.chip.crit{background:var(--crit-soft);color:var(--crit)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.info{background:var(--info-soft);color:var(--info)} .chip.mut{background:var(--surface-2);color:var(--muted)}
.bad{color:var(--crit);font-weight:600} .meh{color:var(--warn);font-weight:600} .good{color:var(--ok)} .dim{color:var(--muted)}

.sev.crit{background:var(--crit)} .sev.warn{background:var(--warn)} .sev.info{background:var(--info)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(60px,auto);gap:10px;align-items:center;font-size:13px}

.bar-row .val{font-family:var(--font-data);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.subtabs{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- estilo: banda roja corporativa, tarjetas en verde grisáceo ---------- */
:root{--brand:#7a1230;--brand-2:#3d0716;--brand-fg:#ffffff;--card-tint:#f5f9f6;--card-line:#d3e0d8;
  --bg:#eef3f0;--surface:#ffffff;--surface-2:#e6eee9;--line:#d3ddd7;--fg:#17221d;--muted:#56665e;
  --accent:#8a1638;--accent-fg:#ffffff;--accent-soft:#f6e3e9;--ok:#23794a;--ok-soft:#dcefe3}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--brand:#5e0e26;--brand-2:#24040d;--brand-fg:#fff;--card-tint:#18241f;--card-line:#2b3d34;
  --bg:#0e1512;--surface:#141e1a;--surface-2:#1a2722;--line:#2a3a33;--fg:#e4ece7;--muted:#97aaa1;--accent:#ff6b7f;--accent-fg:#2a0309;--accent-soft:#3a1720}}
:root[data-theme="dark"]{--brand:#5e0e26;--brand-2:#24040d;--brand-fg:#fff;--card-tint:#18241f;--card-line:#2b3d34;
  --bg:#0e1512;--surface:#141e1a;--surface-2:#1a2722;--line:#2a3a33;--fg:#e4ece7;--muted:#97aaa1;--accent:#ff6b7f;--accent-fg:#2a0309;--accent-soft:#3a1720}
body::before{background:var(--brand)}
header.top{background:radial-gradient(120% 160% at 100% 0%,rgba(214,70,110,.45) 0%,rgba(214,70,110,0) 55%),radial-gradient(90% 140% at 0% 100%,rgba(20,0,8,.55) 0%,rgba(20,0,8,0) 60%),linear-gradient(115deg,#4a0a1d 0%,var(--brand) 45%,#9b1d43 100%);border-bottom:0;color:var(--brand-fg);box-shadow:inset 0 -1px 0 rgba(255,255,255,.08)}
#srcInfo{display:none}
header.top .wrap{padding-block:22px 18px}

#syncInfo.live .sync-dot{background:#8ff0b5}
nav.tabs{box-shadow:0 1px 0 var(--line)}

.tab-sep{flex:0 0 1px;background:var(--line);margin:10px 6px}
.kpi,.card{background:var(--card-tint);border-color:var(--card-line)}
.kpi{border-radius:10px;box-shadow:0 1px 2px rgba(20,40,30,.05)}
.card{border-radius:10px}
.tbl-wrap{border-color:var(--card-line)}

.blk-h{margin:6px 0 -8px}
table.sheet td,table.sheet th{white-space:nowrap}

.code-cell{text-align:center}
.code.tone-acc{background:var(--accent-soft);color:var(--accent)} .code.tone-warn{background:var(--warn-soft);color:var(--warn)}
.code.tone-info{background:var(--info-soft);color:var(--info)} .code.tone-ok{background:var(--ok-soft);color:var(--ok)}

/* pestañas del Excel: centradas y con un color por agente */
:root{--g-esteban:#8a1638;--g-johan:#1f7a4d;--g-paula:#2f5ea8;--g-kristel:#b0700f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--g-esteban:#f08aa6;--g-johan:#6fd19c;--g-paula:#8fb2f0;--g-kristel:#f0b85a}}

/* ---------- filtros de selección múltiple ---------- */
.ms{position:relative}
.ms>summary{list-style:none;cursor:pointer;background:#fff;color:#17221d;border-radius:6px;padding:6px 30px 6px 10px;min-height:34px;min-width:150px;max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;position:relative}
.ms>summary::-webkit-details-marker{display:none}
.ms>summary::after{content:"";position:absolute;right:11px;top:50%;width:7px;height:7px;border-right:2px solid #56665e;border-bottom:2px solid #56665e;transform:translateY(-70%) rotate(45deg)}
.ms[open]>summary{outline:2px solid rgba(255,255,255,.7)}
.ms-pop{position:absolute;z-index:40;top:calc(100% + 6px);left:0;min-width:240px;max-width:min(320px,90vw);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(10,20,15,.22);padding:8px;display:flex;flex-direction:column;gap:2px;max-height:60vh;overflow:auto}
.ms-pop label,header.top .ms-pop label{display:flex;gap:9px;align-items:center;padding:7px 8px;border-radius:6px;cursor:pointer;font-size:13.5px;text-transform:none;letter-spacing:0;color:var(--fg);font-weight:500}
.ms-pop label:hover{background:var(--surface-2)}
.ms-pop input{width:16px;height:16px;accent-color:var(--accent)}
.ms-pop .ms-act{display:flex;gap:6px;padding:4px 4px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}

<script>
const RAW_DEFAULT = {};

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);

const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const pad = n => String(n).padStart(2,'0');
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const MONTHS={ene:1,feb:2,mar:3,abr:4,may:5,jun:6,jul:7,ago:8,sep:9,set:9,oct:10,nov:11,dic:12};
const monthOf = s => { const t=norm(s).replace(/[^a-z]/g,''); return MONTHS[t.slice(0,3)] || null; };
const WD={domingo:0,lunes:1,martes:2,miercoles:3,jueves:4,viernes:5,sabado:6};
const WD_SHORT=['dom','lun','mar','mié','jue','vie','sáb'];

function serialToISO(n){const d=new Date(Math.round((n-25569)*864e5));return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
function toISO(v){
  if(typeof v==='number' && v>1000) return serialToISO(Math.floor(v+1e-7));
  if(v instanceof Date) return v.getFullYear()+'-'+pad(v.getMonth()+1)+'-'+pad(v.getDate());
  if(typeof v==='string'){let m=v.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+'-'+pad(m[2])+'-'+pad(m[3]);
    m=v.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);if(m)return m[3]+'-'+pad(m[2])+'-'+pad(m[1]);}
  return null;
}

  const out=[]; const re=/(\d{1,2})(?::(\d{2}))(?::(\d{2}))?\s*(a\.?\s?m\.?|p\.?\s?m\.?)?/gi; let m;

    if(ap==='p'&&h<12)h+=12; if(ap==='a'&&h===12)h=0; out.push(h*3600+mi*60+s);}

}

function compute(){

  M.agents.forEach(a=>{
    const dset=new Set(a.login?M.events.filter(e=>e.login===a.login).map(e=>e.date):[]);
    if(a.p)Object.values(M.sched).forEach(s=>{if(s.p===a.p)dset.add(s.date)});
    [...dset].sort().forEach(date=>{
      const evs=a.login?(byAD[a.login+'|'+date]||[]):[];
      const s=a.p?M.sched[a.p.key+'|'+date]||null:null;
      const au=a.p?M.aus[a.p.key+'|'+date]:null;
      const D={a,date,evs,s,aus:au,alerts:[],sessions:[],pauses:[],ptot:{},calls:[],ring:[],gaps:[],connected:0,late:0,lateSec:0,lunchExc:0,breakExc:0,outDiff:null,status:null};
      const add=(sev,type,detail,sec,t)=>{const x={sev,type,detail,sec:sec??null,t:t??null,day:D};D.alerts.push(x);alerts.push(x)};
      const lins=evs.filter(e=>e.kind==='login'),louts=evs.filter(e=>e.kind==='logout');
      const ses=louts.map(o=>({s:Math.max(0,o.t-o.dur),e:o.t}));
      lins.forEach(l=>{if(!ses.some(x=>Math.abs(x.s-l.t)<=90))ses.push({s:l.t,e:null,open:true})});
      ses.sort((x,y)=>x.s-y.s);D.sessions=ses;D.connected=ses.reduce((t,x)=>t+(x.e!=null?x.e-x.s:0),0);
      D.firstIn=lins.length?Math.min(...lins.map(e=>e.t)):ses.length?ses[0].s:null;
      D.lastOut=louts.length?Math.max(...louts.map(e=>e.t)):null;
      D.ip=(lins[0]||louts[0]||{}).desc||'';
      D.pauses=evs.filter(e=>e.kind==='pausa');D.pauses.forEach(p=>D.ptot[p.cat]=(D.ptot[p.cat]||0)+p.dur);
      D.calls=evs.filter(e=>e.kind==='llamada');D.ring=evs.filter(e=>e.kind==='timbrado'&&norm(e.razon).includes('sin respuesta'));
      const audesc=au?(au.startsWith('N:')?au.slice(2):AUS_L[au]||au):null;
      if(!evs.length){
        if(!s)return; /* sin turno y sin conexión (fin de semana): no cuenta */
        if(audesc){D.status={c:'info',t:audesc};days.push(D);return}
        if(!M.dMax||date>M.dMax){D.status={c:'mut',t:'Sin datos aún'};D.pending=true;days.push(D);return}
        if(M.dMin&&date<M.dMin){D.status={c:'mut',t:'Antes de la data'};D.pending=true;days.push(D);return}
        D.status={c:'crit',t:'Sin conexión'};D.absent=true;add('crit','Sin conexión','Tenía turno '+tTxt(s.in,s.p)+'–'+tTxt(s.out,s.p)+' y no aparece ningún registro.',null);days.push(D);return}
      if(audesc)add('info','Conectado en novedad','El día está marcado como '+audesc+' en la Malla mensual.',null);
      if(!s){D.status={c:'info',t:'Fuera de programación'};D.offsched=true;days.push(D);return}
      /* login */
      if(D.firstIn!=null){const raw=Math.floor(D.firstIn/60)-Math.floor(s.in/60);D.lateRaw=raw;
        if(raw>CFG.tolIn){D.late=raw;D.lateSec=raw*60;add(raw>15?'crit':'warn','Llegada tarde','Entrada '+tTxt(s.in,s.p)+' · login '+tTxt(D.firstIn,s.p,1)+' → '+raw+' min tarde.',raw*60,D.firstIn)}}
      /* logout: salir después favorece (verde); salir antes se muestra pero no suma */
      if(D.lastOut!=null){D.outDiff=Math.floor(D.lastOut/60)-Math.floor(s.out/60);
        if(D.outDiff<0)add('info','Salió antes','Salida '+tTxt(s.out,s.p)+' · logout '+tTxt(D.lastOut,s.p,1)+' ('+(-D.outDiff)+' min antes).',-D.outDiff*60,D.lastOut)}
      else if(date===M.dMax)add('info','Sin logout aún','Último día de la data: puede que la jornada siguiera en curso cuando se descargó.',null);else add('warn','Sin logout','Hay login pero no se registró el Logout ese día.',null);
      /* almuerzo */
      const L=D.pauses.filter(p=>p.cat==='Almuerzo');D.lunchDur=L.reduce((t,p)=>t+p.dur,0);D.lunchStart=L.length?L[0].t:null;D.lunchEnd=L.length?L[L.length-1].t+L[L.length-1].dur:null;
      const lim=(CFG.limits.Almuerzo||60)*60;D.lunchExc=Math.max(0,D.lunchDur-lim);
      if(D.lunchExc>0)add(D.lunchExc>=600?'crit':'warn','Exceso almuerzo','Almuerzo de '+mDur(D.lunchDur)+' (límite '+(lim/60)+' min) → +'+mDur(D.lunchExc)+'.',D.lunchExc,D.lunchStart);
      if(s.lunch&&D.lunchStart!=null){D.lunchShift=Math.round((D.lunchStart-s.lunch[0])/60);if(Math.abs(D.lunchShift)>CFG.lunchWin)add('info','Almuerzo fuera de franja','Salió a almorzar a las '+tTxt(D.lunchStart,s.p)+'; su franja es '+tTxt(s.lunch[0],s.p)+'–'+tTxt(s.lunch[1],s.p)+'.',null,D.lunchStart)}
      if(s.lunch&&!L.length&&D.connected>4*3600)add('info','Sin almuerzo registrado','No hay pausa de Almuerzo en el día.',null);
      /* breaks */
      const kl=s.breaks&&s.breaks.length?CFG.kLimits:CFG.limits;
      D.pauses.filter(p=>BREAK_CATS.includes(p.cat)).forEach(p=>{const Lm=p.cat==='Baño'?CFG.limits['Baño']:kl[p.cat];p.lim=Lm;
        if(Lm!=null&&Lm!==''&&p.dur>Lm*60){p.exc=p.dur-Lm*60;D.breakExc+=p.exc;add(p.exc>=600?'crit':'warn','Exceso '+p.cat,p.cat+' de las '+tTxt(p.t,s.p)+' duró '+mDur(p.dur)+' (límite '+Lm+' min) → +'+mDur(p.exc)+'.',p.exc,p.t)}
        const sb=(s.breaks||[]).find(b=>b.cat===p.cat||(p.cat==='Recreo'&&b.cat==='Break'));p.sched=sb||null});
      (s.breaks||[]).forEach(b=>{if(!D.pauses.some(p=>p.cat===b.cat||(b.cat==='Break'&&p.cat==='Recreo')))D.missing=(D.missing||[]).concat(b.cat)});
      /* desconexiones dentro del turno (sin contar el almuerzo) */
      if(a.ownData){for(let i=1;i<ses.length;i++){const pv=ses[i-1];if(pv.e==null)continue;const lo=Math.max(pv.e,s.in),hi=Math.min(ses[i].s,s.out);if(hi<=lo)continue;let gsec=hi-lo;
        if(s.lunch){const l0=Math.max(lo,s.lunch[0]),l1=Math.min(hi,s.lunch[1]);if(l1>l0)gsec-=l1-l0}
        if(gsec>CFG.gapMin*60){D.gaps.push({a:pv.e,b:ses[i].s,dur:gsec});add(gsec>=1800?'crit':'warn','Desconexión','Desconectado de '+tTxt(pv.e,s.p,1)+' a '+tTxt(ses[i].s,s.p,1)+' ('+hDur(gsec)+' dentro del turno).',gsec,pv.e)}}}
      if(CFG.ringAlert&&D.ring.length)add('info','Timbrado sin respuesta',D.ring.length+' llamada(s) timbraron y no se contestaron.',null,D.ring[0].t);
      D.total=D.lateSec+D.lunchExc+D.breakExc;
      D.status=D.late>0?{c:'crit',t:'Llegó tarde'}:D.total>0?{c:'warn',t:'Exceso en pausas'}:D.alerts.some(x=>x.sev==='crit'||x.sev==='warn')?{c:'warn',t:'Con novedades'}:{c:'ok',t:'A tiempo'};
      days.push(D);
    });
  });
  const order={crit:0,warn:1,info:2};
  alerts.sort((x,y)=>x.day.date<y.day.date?1:x.day.date>y.day.date?-1:order[x.sev]-order[y.sev]);
  return {days,alerts};
}

    const run=(fmt,end)=>{const t0=performance.now(),D=900;const step=now=>{const k=Math.min(1,(now-t0)/D),e=1-Math.pow(1-k,3);el.textContent=fmt(end*e);if(k<1)requestAnimationFrame(step);else el.textContent=t};el.textContent=fmt(0);requestAnimationFrame(step)};
    if((m=t.match(/^([+−-]?)(\d+):(\d{2})(.*)$/))){const tot=(+m[2])*60+(+m[3]);run(v=>{v=Math.round(v);return m[1]+Math.floor(v/60)+':'+pad(v%60)+m[4]},tot)}
    else if((m=t.match(/^(\d+)(%?)(\s.*)?$/))){run(v=>Math.round(v)+m[2]+(m[3]||''),+m[1])}
    else if((m=t.match(/^(\d+) de (\d+)$/))){run(v=>Math.round(v)+' de '+m[2],+m[1])}
    else if((m=t.match(/^(\d+) min$/))){run(v=>Math.round(v)+' min',+m[1])}});
}

/* ---------- Breaks ---------- */

  const sum=[];ags.forEach(a=>{const sch=ACCTS[a.acct]?.scheduledBreaks;BREAK_CATS.forEach(c=>{const it=items.filter(o=>o.D.a===a&&o.p.cat===c);const lim=c==='Baño'?CFG.limits['Baño']:(sch?CFG.kLimits:CFG.limits)[c];
    const progs=sch&&c!=='Baño'&&c!=='Recreo'?(a.p&&ds.find(d=>d.a===a)?.s.breaks.find(b=>b.cat===c)):null;

/* ---------- Festivos: laborado (LAB) o no laborado (NL) según el horario ---------- */
let FEST_ALL=false;
function vFestivos(el){
  const f=F();const all=Object.keys(M.fest||{}).sort();
  const schedDates=Object.values(M.sched).map(x=>x.date).sort();const sMaxS=schedDates[schedDates.length-1]||'';const sMinS=schedDates[0]||'';
  const sel=d=>(!f.Mo||f.Mo.includes(d.slice(0,7)))&&(!f.Wk||f.Wk.includes(mondayOf(d)))&&(!f.D||f.D.includes(d));
  let fd=FEST_ALL?all.filter(sel):all.filter(d=>d>=sMinS&&d<=sMaxS&&sel(d));const showAll=FEST_ALL;
  const ps=PEOPLE.filter(p=>(!f.A?true:f.A.includes(p.key))&&(!f.C||f.C.includes(p.acct)));
  const st=(p,d)=>{if(d>sMaxS||d<sMinS)return 'NA';const s=M.sched[p.key+'|'+d];return s?'LAB':'NL'};
  const conn=(p,d)=>{const a=M.agents.find(x=>x.p===p);return a&&a.login?M.events.some(e=>e.login===a.login&&e.date===d):false};
  let lab=0,nl=0;ps.forEach(p=>fd.forEach(d=>{const v=st(p,d);if(v==='LAB')lab++;else if(v==='NL')nl++}));
  const cell=(p,d)=>{const v=st(p,d);const c=conn(p,d);const nov=novCode(p,d);
    if(v==='NA')return `<td class="fx na" title="${esc(p.name+' · '+fDate(d)+' · sin horario cargado para esa fecha')}">—</td>`;
    return `<td class="fx ${v==='LAB'?'lab':'nl'}" title="${esc(p.name+' · '+fDate(d)+' · '+(v==='LAB'?'Laborado (tiene horario)':'No laborado (sin horario)')+(c?' · con conexión ese día':'')+(nov?' · '+nov.t:''))}"><b>${v}</b>${c?'<small>con conexión</small>':nov?`<small>${esc(nov.c)}</small>`:''}</td>`};
  const rows=()=>[['Agente','Cuenta',...fd.map(d=>d+' '+M.fest[d]),'Laborados','No laborados'],...ps.map(p=>{const r=fd.map(d=>{const v=st(p,d);return v==='NA'?'Sin horario':v==='LAB'?'LAB · Laborado':'NL · No laborado'});return [p.name,ACCTS[p.acct]?.label||p.acct,...r,r.filter(x=>x.startsWith('LAB')).length,r.filter(x=>x.startsWith('NL')).length]})];
  el.innerHTML=toolbar('Festivos',`${showAll?'Todos los festivos de la pestaña Festivos del documento. ':'Festivos del periodo con horarios cargados ('+fDate(sMinS)+' al '+fDate(sMaxS)+' '+sMaxS.slice(0,4)+'). '}Si el agente tiene horario ese día es <b>laborado</b>; si no tiene horario, <b>no laborado</b>. Las fechas sin horarios cargados todavía salen en gris.`,`<div class="seg"><button type="button" data-fa="0" aria-pressed="${!FEST_ALL}">Con horarios</button><button type="button" data-fa="1" aria-pressed="${FEST_ALL}">Todos los del año</button></div>`+dl(()=>({file:'festivos_'+fileTag(),sheets:[{name:'Festivos',rows:rows()}]})))+
  `<div class="kpis"><div class="kpi acc"><span class="l">Festivos</span><span class="v">${fd.length}</span><span class="s">${showAll?'en el documento':'en el periodo'}</span></div>
   <div class="kpi ok"><span class="l">Laborados</span><span class="v">${lab}</span><span class="s">agente-festivo con horario</span></div>
   <div class="kpi warn"><span class="l">No laborados</span><span class="v">${nl}</span><span class="s">agente-festivo sin horario</span></div></div>
  <div class="card"><div class="card-h"><h3>Tablero de festivos por teleoperador</h3><div class="legend"><span><i style="background:var(--ok)"></i><b>LAB</b> Laborado</span><span><i style="background:#e9b10f"></i><b>NL</b> No laborado</span><span><i style="background:var(--surface-2)"></i>— Sin horario cargado</span></div></div>
   ${fd.length?`<div class="tbl-wrap"><table class="fest"><thead><tr><th style="text-align:left">Teleoperador</th>${fd.map(d=>`<th><span class="fd">${WD_SHORT[wday(d)]} ${+d.slice(8)} ${MON_SHORT[+d.slice(5,7)]}</span><span class="fn">${esc(M.fest[d])}</span></th>`).join('')}<th>LAB</th><th>NL</th></tr></thead>
    <tbody>${ps.map(p=>{let a=0,b=0;fd.forEach(d=>{const v=st(p,d);if(v==='LAB')a++;else if(v==='NL')b++});return `<tr><td>${agCell({name:p.name,color:p.color})}<span class="tz">${esc(ACCTS[p.acct]?.label||p.acct)}</span></td>${fd.map(d=>cell(p,d)).join('')}<td class="c"><span class="pill ok">${a}</span></td><td class="c"><span class="pill warn">${b}</span></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">No hay festivos en el periodo. Usa “Todos los del año” para verlos todos.</div>'}</div>`;
  el.querySelectorAll('[data-fa]').forEach(b=>b.onclick=()=>{FEST_ALL=b.dataset.fa==='1';render()});
}

/* ---------- detalle del día ---------- */
function openDay(D){
  if(!D)return;const dr=$('#drawer');const s=D.s;const P=D.a.p;const ev=D.evs;
  const all=[...ev.map(e=>e.t),...ev.map(e=>e.t+(e.kind==='logout'?0:e.dur))];if(s)all.push(s.in,s.out);
  const lo=Math.floor((Math.min(...all,(s?s.in:8*3600)))/3600)*3600,hi=Math.ceil((Math.max(...all,(s?s.out:17*3600)))/3600)*3600;
  const W=1000,L=110,Rr=16,x=t=>L+(t-lo)/(hi-lo)*(W-L-Rr);
  const lane=(y,lab)=>`<text class="lab" x="0" y="${y+13}">${lab}</text><rect x="${L}" y="${y}" width="${W-L-Rr}" height="18" fill="var(--surface-2)"/>`;
  let svg=`<svg class="tl" viewBox="0 0 ${W} 170" role="img" aria-label="Línea de tiempo del día">`;
  for(let h=lo;h<=hi;h+=3600)svg+=`<line x1="${x(h)}" x2="${x(h)}" y1="18" y2="150" stroke="var(--line)"/><text x="${x(h)}" y="164" text-anchor="middle">${hm(loc(h,P))}</text>`;
  svg+=lane(20,'Horario')+lane(50,'Conectado')+lane(80,'Pausas')+lane(110,'Llamadas');
  if(s){svg+=`<rect x="${x(s.in)}" y="20" width="${x(s.out)-x(s.in)}" height="18" fill="var(--accent)" opacity=".3"/>`;
    if(s.lunch)svg+=`<rect x="${x(s.lunch[0])}" y="20" width="${x(s.lunch[1])-x(s.lunch[0])}" height="18" fill="var(--p-alm)" opacity=".6"/>`;
    s.breaks.forEach(b=>svg+=`<rect x="${x(b.a)}" y="20" width="${Math.max(2,x(b.b)-x(b.a))}" height="18" fill="${pColor(b.cat)}" opacity=".8"/>`);
    svg+=`<line x1="${x(s.in)}" x2="${x(s.in)}" y1="14" y2="132" stroke="var(--accent)" stroke-dasharray="3 3"/><line x1="${x(s.out)}" x2="${x(s.out)}" y1="14" y2="132" stroke="var(--accent)" stroke-dasharray="3 3"/>`}
  D.sessions.forEach(z=>{const e=z.e??(D.lastOut&&D.lastOut>z.s?D.lastOut:z.s+600);svg+=`<rect x="${x(z.s)}" y="50" width="${Math.max(2,x(e)-x(z.s))}" height="18" fill="var(--ok)" opacity="${z.e==null?.4:.8}"><title>${tTxt(z.s,P,1)} – ${z.e==null?'sin logout':tTxt(z.e,P,1)}</title></rect>`});
  D.pauses.forEach(p=>svg+=`<rect x="${x(p.t)}" y="80" width="${Math.max(2,x(p.t+p.dur)-x(p.t))}" height="18" fill="${pColor(p.cat)}" ${p.exc?'stroke="var(--crit)" stroke-width="2"':''}><title>${p.cat} ${tTxt(p.t,P,1)} · ${mDur(p.dur)}</title></rect>`);
  D.calls.forEach(c=>svg+=`<rect x="${x(c.t)}" y="110" width="${Math.max(1.5,x(c.t+c.dur)-x(c.t))}" height="18" fill="var(--info)" opacity=".75"><title>${c.tipo} ${tTxt(c.t,P,1)}</title></rect>`);
  svg+='</svg>';
  dr.innerHTML=`<div class="in" role="dialog" aria-modal="true" aria-label="Detalle del día">
   <div class="hd"><div><h2>${esc(D.a.name)} · ${fDate(D.date)} ${D.date.slice(0,4)}</h2><div class="sub">${esc(D.a.login||'sin usuario en la data')} · ${esc(ACCTS[D.a.acct]?.label||D.a.acct)}${isTZ(P)?' · horas en Costa Rica':''}${D.s&&D.s.fest?' · festivo: '+esc(D.s.fest):''}</div></div><div style="display:flex;gap:8px;flex-wrap:wrap">${dl(()=>({file:'dia_'+slug(D.a.name)+'_'+D.date,sheets:[{name:'Resumen del día',rows:rowsDays([D])},{name:'Registros',rows:rowsConexiones(D.evs)},{name:'Pausas',rows:rowsPausas([D])},{name:'Alertas',rows:rowsAlertas(D.alerts)}]}))}<button type="button" id="drClose">Cerrar</button></div></div>
   <div class="kpis">

   ${D.alerts.length?`<div class="card"><h3>Alertas del día</h3>${D.alerts.map(a=>`<div><span class="sev ${a.sev}"></span><b>${esc(a.type)}</b> — ${esc(a.detail)}</div>`).join('')}</div>`:''}

    ${ev.map(e=>`<tr><td class="c mono">${hms(loc(e.t,P))}</td><td class="c mono dim">${hms(e.t0)}</td><td>${esc(e.tipo)}</td><td>${e.kind==='pausa'?`<b style="color:${pColor(e.cat)}">${esc(e.desc||'—')}</b>`:esc(e.desc)}</td><td>${esc(e.razon)}</td><td class="c mono ${e.exc?'bad':''}">${e.dur?mDur(e.dur):''}</td><td>${esc(e.camp)}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">Sin registros este día</td></tr>'}

let DL={},DLN=0;
function dl(fn,label){const id='d'+(++DLN);DL[id]=fn;return `<button type="button" class="dl" data-dl="${id}">${label||'Descargar Excel'}</button>`}

async function saveXlsx(spec){
  if(!window.XLSX){toast('No se pudo cargar el generador de Excel');return}
  const wb=XLSX.utils.book_new();const used=new Set();
  spec.sheets.forEach(sh=>{let n=String(sh.name).replace(/[\[\]\*\?\/\\:]/g,' ').slice(0,31)||'Hoja';let k=n,i=2;while(used.has(k))k=n.slice(0,28)+' '+(i++);used.add(k);
    const ws=XLSX.utils.aoa_to_sheet(sh.rows.length?sh.rows:[['Sin datos']]);ws['!cols']=(sh.rows[0]||[]).map((_,c)=>({wch:Math.min(48,Math.max(8,...sh.rows.slice(0,300).map(r=>String(r[c]??'').length+1)))}));XLSX.utils.book_append_sheet(wb,ws,k)});
  const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  let d=null;try{d=window.claude&&window.claude.use?await claude.use('downloads'):null}catch(e){}
  if(!d){toast('La descarga no está disponible en esta vista; abre el dashboard en claude.ai');return}
  try{await d.save({filename:spec.file+'.xlsx',data:new Blob([buf])});toast('Descargado')}
  catch(err){if(err&&err.code==='declined')return;toast('No se pudo descargar ('+(err&&err.code||'error')+')')}
}

let C_Q='',C_T='',C_PAGE=0;

  <div class="fld"><label for="cQ">Buscar</label><input type="search" id="cQ" value="${esc(C_Q)}" placeholder="IP, razón, número, país…"></div><div class="fld"><label>&nbsp;</label>${dl(()=>({file:'control-conexiones_'+fileTag(),sheets:[{name:'Control Conexiones',rows:rowsConexiones(ev)}]}),'Descargar '+ev.length.toLocaleString('es')+' registros')}</div></div>
  <div class="tbl-wrap"><table><thead><tr><th>Fecha</th><th class="n">Hora</th><th class="n">Hora Colombia</th><th>Agente</th><th>Tipo</th><th>Descripción</th><th>Razón</th><th>Resultado</th><th class="n">Duración</th><th class="n">Espera</th><th>Campaña</th><th>DID origen</th><th>DID destino</th><th>País</th></tr></thead><tbody>
  ${sl.map(e=>{const a=agentBy(e.login);const tag=e.kind==='login'?'<span class="chip ok">Login</span>':e.kind==='logout'?'<span class="chip info">Logout</span>':esc(e.razon);

  </tbody></table></div>

const CODE_TONE={AP:'acc',CI:'mut',FT:'warn',F:'warn',FEST:'warn',PA:'info',PB:'info',KX:'ok',KB:'ok',KF:'ok',V:'info',I:'crit',L:'mut'};
function vSheet(el,name){
  const G=(M.FMT&&M.FMT[name])||(M.raw[name]||[]).map(r=>r.map(v=>typeof v==='number'?(v>30000?fDate(serialToISO(Math.floor(v+1e-7))):v<1&&v>0?fT(timeSec(v)):String(+v.toFixed(2))):String(v??'')));
  let rows=G.map(r=>r.map(v=>String(v??'').trim()));
  let c0=Infinity,c1=0;rows.forEach(r=>r.forEach((v,i)=>{if(v){c0=Math.min(c0,i);c1=Math.max(c1,i)}}));if(c0===Infinity){el.innerHTML='<div class="empty">Esta pestaña está vacía.</div>';return}
  rows=rows.map(r=>{const x=r.slice(c0,c1+1);while(x.length<c1-c0+1)x.push('');return x});
  const title=rows[0].find(Boolean)||name;let body=rows.slice(1);let intro='';
  if(body.length&&body[0].filter(Boolean).length===1&&body[0].find(Boolean).length>40){intro=body[0].find(Boolean);body=body.slice(1)}
  /* bloques separados por filas vacías */
  const blocks=[];let cur=[];body.forEach(r=>{if(r.every(v=>!v)){if(cur.length)blocks.push(cur);cur=[]}else cur.push(r)});if(cur.length)blocks.push(cur);
  const isMalla=norm(name).startsWith('malla');
  /* filtro de agente: quita filas y columnas que pertenecen a otra persona */
  const fa=singleAgent();const selP=fa&&fa.p?fa.p.key:null;let hidden=0;
  const FN=PEOPLE.map(p=>norm(p.name).split(' ')[0]);const who=v=>{const n=norm(v);return FN.find(f=>n===f||n.startsWith(f+' ')||n.startsWith(f+'(')||n.startsWith(f+' ('))||null};
  const owners=b=>{const own=new Array(b[0].length).fill(null);b.slice(0,6).forEach(r=>{const hits=r.map(who).filter(Boolean);if(new Set(hits).size<2)return;let cur=null;r.forEach((v,i)=>{if(v){cur=who(v)||'-'}if(cur&&!own[i])own[i]=cur})});return own.map(o=>o==='-'?null:o)};
  if(selP){
    const filt=b=>{const own=new Array(b[0].length).fill(null);
      b.slice(0,6).forEach(r=>{const hits=r.map(who).filter(Boolean);if(new Set(hits).size<2)return;let cur=null;r.forEach((v,i)=>{if(v){cur=who(v)}if(cur&&!own[i])own[i]=cur})});
      const keep=own.map(o=>!o||o===selP);hidden+=keep.filter(k=>!k).length;
      return b.filter(r=>{const lab=r.find(Boolean)||'';const w=who(lab);if(w&&w!==selP){hidden++;return false}return true}).map(r=>r.filter((_,i)=>keep[i]))};
    blocks.splice(0,blocks.length,...blocks.map(filt).filter(b=>b.length&&b[0].length))}
  const cell=(v,hdr)=>{if(!v)return '<td></td>';const t=CODE_TONE[v];if(t&&v.length<=4)return `<td class="code-cell"><span class="code tone-${t}">${esc(v)}</span></td>`;
    const num=/^-?[\d.,:%]+$/.test(v)||/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(v);return `<td class="${num?'n':v.length>48?'wrap-cell':''}">${esc(v)}</td>`};
  const tbl=b=>{const cols=b[0].length;let used=[];for(let i=0;i<cols;i++)if(b.some(r=>r[i]))used.push(i);b=b.map(r=>used.map(i=>r[i]));
    const head=b.length>1&&b[0].filter(Boolean).length>=Math.max(2,Math.ceil(b[0].length*.5))&&!b[0].some(v=>CODE_TONE[v]);
    if(b.length===1||b[0].filter(Boolean).length===1&&b.length>1&&!head){const lab=b[0].filter(Boolean);if(lab.length===1&&b.length===1)return `<h3 class="blk-h">${esc(lab[0])}</h3>`}
    let h='';let rs=b;if(b[0].filter(Boolean).length===1&&b.length>1&&b[0][0]===''&&b[0].find(Boolean).length<80){h=`<h3 class="blk-h">${esc(b[0].find(Boolean))}</h3>`;rs=b.slice(1)}
    const own=owners(rs);const gc=i=>{const o=own[i];if(!o)return '';return ' g-'+o+(i===0||own[i-1]!==o?' g-start':'')};
    const isGroupRow=r=>new Set(r.map(who).filter(Boolean)).size>=2;
    const hd=rs.length>1&&rs[0].filter(Boolean).length>=2&&!isMalla?rs[0]:null;let bodyR=hd?rs.slice(1):rs;
    let thead='';
    if(hd&&isGroupRow(hd)){/* fila de grupos: cada nombre ocupa sus columnas */
      let cells='';for(let i=0;i<hd.length;){let j=i+1;while(j<hd.length&&!hd[j])j++;cells+=`<th colspan="${j-i}" class="grp${gc(i)}">${esc(hd[i])}</th>`;i=j}
      thead=`<tr>${cells}</tr>`;
      const r2=bodyR[0];if(r2&&r2.filter(Boolean).length>=r2.length*.5&&!r2.some(v=>/^\d/.test(v))){thead+=`<tr>${r2.map((v,i)=>`<th class="${gc(i).trim()}">${esc(v)}</th>`).join('')}</tr>`;bodyR=bodyR.slice(1)}
    } else if(hd)thead=`<tr>${hd.map((v,i)=>`<th class="${gc(i).trim()}">${esc(v)}</th>`).join('')}</tr>`;
    const td=(v,i)=>{const c=gc(i);if(!v)return `<td class="${c.trim()}"></td>`;const t=CODE_TONE[v];if(t&&v.length<=4)return `<td class="code-cell${c}"><span class="code tone-${t}">${esc(v)}</span></td>`;
      const num=/^-?[\d.,:%]+$/.test(v)||/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(v);return `<td class="${num?'num':v.length>48?'wrap-cell':''}${c}">${esc(v)}</td>`};
    return `${h}<div class="tbl-wrap"><table class="${isMalla?'cal sheet':'sheet'}">${thead?`<thead>${thead}</thead>`:''}<tbody>${bodyR.map(r=>{const nz=r.filter(Boolean);if(nz.length===1&&nz[0].length>48&&!isMalla)return `<tr><td colspan="${r.length}" class="note-row">${esc(nz[0])}</td></tr>`;return `<tr>${r.map((v,i)=>i===0&&(isMalla||!hd)&&v?`<th scope="row">${esc(v)}</th>`:td(v,i)).join('')}</tr>`}).join('')}</tbody></table></div>`};
  el.innerHTML=`<div class="toolbar"><div class="grow"><h2>${esc(title)}</h2>${intro?`<p class="note" style="margin:4px 0 0">${esc(intro)}</p>`:''}<p class="note" style="margin:4px 0 0">Pestaña <b>${esc(name)}</b> de tu Excel, con los valores que calculó Excel la última vez que se guardó. Para ver otro mes, cámbialo en Parámetros (C4), guarda y vuelve a cargar el archivo.${selP?` <b>Filtrado por ${esc(fa.name)}</b>: se ocultan las filas y columnas de los demás.`:''}</p></div>${dl(()=>({file:slug(name),sheets:[{name,rows:G}]}),'Descargar esta pestaña')}</div>
  ${blocks.map(tbl).join('')}`;
}
let DB=null,AS=null,CAN_WRITE=false,CUR_ID=null,UPDATED=null;
function setSync(state,msg){const el=$('#syncInfo');el.className='sub'+(state?' '+state:'');
  if(!msg){if(state==='live')msg=UPDATED?`En línea · última actualización ${new Date(UPDATED).toLocaleString('es',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}`+(AS&&CAN_WRITE?' · '+esc(SRC):''):'En línea · cada mes descarga tu plantilla con la data de Conexiu pegada y súbela con “Actualizar datos”';
    else msg='Sin conexión a los datos guardados: se muestran los datos incluidos en la página'}
  el.innerHTML='<span class="sync-dot"></span>'+esc(msg)}
async function cloud(){
  if(!window.claude||!window.claude.use){setSync('',M&&M.events.length?'Archivo cargado: '+SRC+' · los datos se procesan solo en tu navegador, no se envían a ningún servidor':'Sube tu plantilla con “Actualizar datos”: los datos se procesan solo en tu navegador, no se envían a ningún servidor');return}
  try{DB=await claude.use('db')}catch(e){DB=null}
  if(!DB){setSync('');return}
  try{AS=await claude.use('assets')}catch(e){AS=null}
  try{const u=await claude.use('user');CAN_WRITE=u?(await u.canEdit())===true:!!AS}catch(e){CAN_WRITE=!!AS}
  if(AS&&CAN_WRITE)$('#btnLoad').textContent='Actualizar datos (subir Excel)';
  setSync('busy','Buscando la última versión de los datos…');
  DB.doc('config/settings2').onSnapshot(snap=>{if(!snap.exists)return;const d=snap.data()||{};
    if(d.cfg){const c=JSON.parse(JSON.stringify(d.cfg));CFG=Object.assign({},CFG_DEFAULT,c);CFG.limits=Object.assign({},CFG_DEFAULT.limits,c.limits||{});CFG.kLimits=Object.assign({},CFG_DEFAULT.kLimits,c.kLimits||{});store.set('ctrlcx.cfg.v2',CFG)}
    MAP_OVR=Object.assign({},d.map||{});store.set('ctrlcx.map.v2',MAP_OVR);reload(M.raw)},()=>{});
  DB.doc('config/plantilla2').onSnapshot(async snap=>{
    if(!snap.exists){setSync('live');return}
    const d=snap.data()||{};UPDATED=d.uploadedAt||null;
    if(!d.assetId||d.assetId===CUR_ID){setSync('live');return}
    CUR_ID=d.assetId;setSync('busy','Cargando '+(d.fileName||'datos')+'…');
    try{const r=await fetch('/_blob/'+d.assetId);if(!r.ok)throw new Error(r.status);const raw=await r.json();
      SRC=d.fileName||'Excel en línea';$('#fFrom').value='';$('#fTo').value='';reload(raw);setSync('live')}
    catch(err){setSync('err','No se pudo abrir el último Excel guardado; se muestran los datos incluidos en la página')}
  },()=>setSync('err','Se perdió la conexión con los datos guardados; recarga la página'));
}
reload(RAW_DEFAULT);
cloud();
